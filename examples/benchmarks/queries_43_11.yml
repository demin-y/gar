# Типичные вводы операторов портала и ожидаемый адрес (full_adm_path) — для
# examples/benchmarks/search_quality.rb на выгрузке субъектов 43 и 11. Ожидания сверены с
# выгрузками 2026.01.16 и 2026.10.02 (точки и регистр кратких типов не сравниваются); выдача —
# Gar.autocomplete без границ поиска.

# Город, улица, дом — разными способами записи
- { query: "Киров Ленина 10",                   expect: "Кировская обл, Киров г, Ленина ул, д. 10" }
- { query: "Киров, ул. Ленина, д. 10",          expect: "Кировская обл, Киров г, Ленина ул, д. 10" }
- { query: "г Киров ул Ленина дом 10",          expect: "Кировская обл, Киров г, Ленина ул, д. 10" }
- { query: "Ленина 10, кв. 5",                  expect: "Кировская обл, Киров г, Ленина ул, д. 10" }
- { query: "г Киров ул Московская д 4",         expect: "Кировская обл, Киров г, Московская ул, д. 4" }
- { query: "Киров, ул Свободы 50",              expect: "Кировская обл, Киров г, Свободы ул, д. 50" }
- { query: "Киров Октябрьский пр-кт 117",       expect: "Кировская обл, Киров г, Октябрьский пр-кт, д. 117" }
- { query: "Киров Октябрьский проспект 117",    expect: "Кировская обл, Киров г, Октябрьский пр-кт, д. 117" }
- { query: "Киров, просп. Октябрьский, д. 117", expect: "Кировская обл, Киров г, Октябрьский пр-кт, д. 117" }
- { query: "Киров Октябрьский 91 к2",           expect: "Кировская обл, Киров г, Октябрьский пр-кт, д. 91 к. 2" }
- { query: "Киров Октябрьский 91 корп. 2",      expect: "Кировская обл, Киров г, Октябрьский пр-кт, д. 91 к. 2" }
- { query: "Киров Воровского 1",                expect: "Кировская обл, Киров г, Воровского ул, д. 1" }
- { query: "Киров им. Кирова",                  expect: "Кировская обл, Киров г, Кирова ул" }
- { query: "Киров Нововятский р-н Советская 1", expect: "Кировская обл, Киров г, Советская (Нововятский) ул, д. 1" }
- { query: "мкр Чистые Пруды",                  expect: "Кировская обл, Киров г, Чистые Пруды п" }

# Районные города и посёлки
- { query: "Слободской Советская 5",            expect: "Кировская обл, Слободской р-н, Слободской г., Советская ул, д. 5" }
- { query: "Кирово-Чепецк Ленина 1",            expect: "Кировская обл, Кирово-Чепецк г., Ленина ул, д. 1" }
- { query: "Котельнич",                         expect: "Кировская обл, Котельничский р-н, Котельнич г." }
- { query: "Уржум",                             expect: "Кировская обл, Уржумский р-н, Уржум г" }

# Коми
- { query: "Сыктывкар Ленина",                  expect: "Коми Респ, Сыктывкар г, Ленина ул" }
- { query: "Сыктывкар Коммунистическая 33",     expect: "Коми Респ, Сыктывкар г, Коммунистическая ул, д. 33" }
- { query: "Сыктывкар Октябрьский пр-кт 15",    expect: "Коми Респ, Сыктывкар г, Октябрьский пр-кт, д. 15" }
- { query: "Сыктывкар Первомайская 80/2",       expect: "Коми Респ, Сыктывкар г, Первомайская ул, соор. 80/2" }
- { query: "Ухта Ленина 1",                     expect: "Коми Респ, Ухта г, Ленина пр-кт, д. 1" }
- { query: "Ухта, пр-т Ленина, д. 10",          expect: "Коми Респ, Ухта г, Ленина пр-кт, д. 10" }
- { query: "Воркута",                           expect: "Коми Респ, Воркута г" }
- { query: "Печора",                            expect: "Коми Респ, Печора г" }

# Начало ввода
- { query: "Киров",                             expect: "Кировская обл, Киров г" }
- { query: "Кир",                               expect: "Кировская обл, Киров г" }
- { query: "Сыктыв",                            expect: "Коми Респ, Сыктывкар г" }
- { query: "Киров Лен",                         expect: "Кировская обл, Киров г, Ленина ул" }
- { query: "Сыктывкар Комм",                    expect: "Коми Респ, Сыктывкар г, Коммунистическая ул" }
