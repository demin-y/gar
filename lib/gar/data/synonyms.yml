# Встроенные группы синонимов поиска (Gar::Synonyms): разговорные и старые формы, которых нет
# в справочниках типов ГАР. Слова — после нормализации запроса: нижний регистр, ё → е, точки
# убраны. Одно слово может входить в несколько групп («б» — «большая» и «бульвар»): поиск
# берёт все варианты, порядок решает ранжирование. Отключить — config.builtin_synonyms = false.

# Типы адресных объектов
- [проспект, пр, просп, пр-т, пр-кт, пркт]
- [проезд, пр, пр-д]
- [бульвар, б-р, бул, б]
- [переулок, пер]
- [площадь, пл]
- [шоссе, ш]
- [набережная, наб]
- [тупик, туп]
- [микрорайон, мкр, мкрн, мкр-н]
- [улица, ул]
- [город, г]
- [поселок, пос, п]
- [поселок городского типа, пгт]
- [деревня, дер, д]
- [село, с]
- [территория, тер]

# Части дома (их же использует разбор номера дома Gar::HouseNumber)
- [дом, д]
- [корпус, к, корп]
- [строение, стр]
- [литера, лит, литер]
- [владение, влд, вл]
- [домовладение, двлд]
- [здание, зд]
- [сооружение, соор]

# Помещения: в строке адреса после номера дома, поиск их отбрасывает
- [квартира, кв]
- [офис, оф]
- [помещение, пом]
- [комната, комн, ком]

# Частые слова в названиях
- [большая, б, бол]
- [малая, м, мал]
- [имени, им]
- [старая, ст]
- [новая, нов]
- [верхняя, верх]
- [нижняя, ниж]
