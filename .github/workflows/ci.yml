name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: bundle exec rubocop

  test:
    name: RSpec (Ruby ${{ matrix.ruby }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        postgres: ['16', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gar_db_test
        ports:
          - 5432:5432
        # Каталог данных в tmpfs: у образа 18+ он лежит внутри /var/lib/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --mount type=tmpfs,destination=/var/lib/postgresql
          --shm-size=1g

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gar_db_test
      GAR_SLOW_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec
